[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mrtg-cmp"
version = "0.1.0"
description = "MikroTik WAN traffic monitoring, history, and reporting for enterprise branch gateways"
readme = "requirements.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "routeros-api>=0.9,<1",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "pillow>=10.0,<13",
    "selenium>=4.20,<5",
    "pyotp>=2.9,<3",
]

[project.scripts]
mrtg-cmp = "mrtg_cmp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest-cov>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["mrtg_cmp"]
strict = true

[[tool.mypy.overrides]]
module = ["routeros_api.*", "openpyxl.*", "matplotlib.*"]
ignore_missing_imports = true
